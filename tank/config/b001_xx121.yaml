      longName: "Height of sensor above water surface"
      units: "m"

    - name: "MetaData/anemometerType"
      source: variables/anemometerType
      chunks: [1000000]
      longName: "Anemometer Type"

    - name: "MetaData/heightOfSensorAboveWater2"
      source: variables/heightOfSensorAboveWater2
      chunks: [1000000]
      longName: "Height of sensor above water surface"
      units: "m"

    - name: "MetaData/timeSignificance"
      source: variables/timeSignificance
      chunks: [1000000]
      longName: "Time Significance"

    - name: "MetaData/timePeriodMinutes"
      source: variables/timePeriodMinutes
      chunks: [1000000]
      longName: "Time Period Or Displacement"
      units: "min"

    - name: "MetaData/timeSignificance2"
      source: variables/timeSignificance2
      chunks: [1000000]
      longName: "Time Significance"

    - name: "MetaData/year"
      source: variables/year
      chunks: [1000000]
      longName: "Year"
      units: "year"

    - name: "MetaData/month"
      source: variables/month
      chunks: [1000000]
      longName: "Month"
      units: "month"

    - name: "MetaData/day"
      source: variables/day
      chunks: [1000000]
      longName: "Day"
      units: "day"

    - name: "MetaData/hour"
      source: variables/hour
      chunks: [1000000]
      longName: "Hour"
      units: "h"

    - name: "MetaData/minute"
      source: variables/minute
      chunks: [1000000]
      longName: "Minute"
      units: "min"

    - name: "MetaData/dataCollectionAndOrLocationSystem"
      source: variables/dataCollectionAndOrLocationSystem
      chunks: [1000000]
      longName: "Data collection and/or location system"

    - name: "MetaData/dirOfMotionOfMovingObservingPlatform"
      source: variables/dirOfMotionOfMovingObservingPlatform
