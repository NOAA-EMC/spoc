time window:
  begin: "2021-07-31T21:00:00Z"
  end: "2021-08-01T03:00:00Z"
  bound to include: begin

observations:
- obs space:
    name: "gsrcsr-g16"
    observed variables: [brightnessTemperature]
    derived variables: [brightnessTemperature]
    simulated variables: [brightnessTemperature]
    obsdatain:
      engine:
        type: script
        script file: "bufr_gsrcsr.py"
        args:
          input: "./testinput/2021080100/gdas.t00z.gsrcsr.tm00.bufr_d"
            #input_path: "./testinput/2021080100/gdas.t00z.gsrcsr.tm00.bufr_d"
          mapping_path: "./bufr_gsrcsr.yaml"
            category: "g16"
    obsdataout:
      engine:
        type: H5File
        obsfile: "./testoutput/2021080100/script4backend/gdas.t00z.gsrcsr_g16.tm00.nc"


