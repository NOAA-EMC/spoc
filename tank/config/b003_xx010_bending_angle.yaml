bufr:
  subsets:
    - NC003010

  # One row per element of this sequence
  group_by_variable: sensorAzimuthAngleRoseq1

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/ROSEQ1/CLATH"

    longitude:
      query: "*/ROSEQ1/CLONH"

    satelliteSubIdentifier:
      query: "*/SASBID"

    satelliteIdentifier:
      query: "*/SAID"

    instrumentIdentifier:
      query: "*/SIID"

    dataProviderOrigin:
      query: "*/OGCE"

    productTypeForRetrievedAtmosphericGases:
      query: "*/PTAG"

    softwareIdentification:
      query: "*/SWID"

    timeSignificance:
      query: "*/TSIG"

    qfro:
      query: "*/QFRO"

    qiWithoutForecast1:
      query: "*/PCCF[1]"

    inDirectionOf0DegLongDistanceFromEarths:
      query: "*/PD00"

    inDirectionOf90DegEDistanceFromEarthsCenter:
      query: "*/PD90"

    absolutePlatformVelocityFirstComponent:
      query: "*/PS00"

    absolutePlatformVelocitySecondComponent:
      query: "*/PS90"

    absolutePlatformVelocityThirdComponent:
      query: "*/PSNP"

    satelliteConstellationRO:
      query: "*/SCLF"

    satelliteTransmitterId:
      query: "*/PTID"

    inDirectionOf0DegLongDistanceFromEarths2:
      query: "*/PD00"

    inDirectionOf90DegEDistanceFromEarthsCenter2:
      query: "*/PD90"

    absolutePlatformVelocityFirstComponent2:
      query: "*/PS00"

    absolutePlatformVelocitySecondComponent2:
      query: "*/PS90"

    absolutePlatformVelocityThirdComponent2:
      query: "*/PSNP"

    timeIncrement:
