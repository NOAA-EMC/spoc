      units: "gpm"

    - name: "MetaData/firstOrderStatistics1Roseq4"
      source: variables/firstOrderStatistics1Roseq4
      chunks: [1000000]
      longName: "First Order Statistics"

    - name: "MetaData/firstOrderStatistics2Roseq4"
      source: variables/firstOrderStatistics2Roseq4
      chunks: [1000000]
      longName: "First Order Statistics"

    - name: "MetaData/qiWithoutForecast"
      source: variables/qiWithoutForecast
