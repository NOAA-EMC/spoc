bufr:
  subsets:
    - NC021123

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    satelliteIdentifier:
      query: "*/SAID"

    instrumentIdentifier:
      query: "*/SIID"

    sensorScanPosition:
      query: "*/FOVN"

    landOrSeaQualifier:
      query: "*/LSQL"

    satelliteZenithAngle:
      query: "*/SAZA"

    solarZenithAngle:
      query: "*/SOZA"

    heightOfStation:
      query: "*/HMSL"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    sensorChannelNumber:
      query: "*/BRITCSTC/CHNM"

    # ObsValue
    heightOfLandSurface:
      query: "*/HOLS"

    brightnessTemperature:
      query: "*/BRITCSTC/TMBR"

    coldSpaceTemperatureCorrection:
      query: "*/BRITCSTC/CSTC"

encoder:
  dimensions:
    - name: Channel
      source: variables/sensorChannelNumber
      path: "*/BRITCSTC"

  globals:
    - name: "description"
      type: string
      value: "MTYP 021-123 PROC AMSU-A 1B Ta (NOAA-15-18, METOP-1,2)"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_amsua"

    - name: "dataFormat"
      type: string
      value: "binary"

    - name: "restricted"
      type: string
      value: "false"

    - name: "satelliteVariable"
      type: string
      value: "MetaData/satelliteIdentifier"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "123"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx123 NC021123"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      chunks: [1000000]
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      chunks: [1000000]
      longName: "Satellite Instruments"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      chunks: [1000000]
      longName: "Field Of View Number"

    - name: "MetaData/landOrSeaQualifier"
      source: variables/landOrSeaQualifier
      chunks: [1000000]
      longName: "LAND/SEA Qualifier"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      chunks: [1000000]
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      chunks: [1000000]
      longName: "Solar Zenith Angle"
      units: "degree"

    - name: "MetaData/heightOfStation"
      source: variables/heightOfStation
      chunks: [1000000]
      longName: "Height Or Altitude"
      units: "m"

    - name: "MetaData/solarAzimuthAngle"
      source: variables/solarAzimuthAngle
      chunks: [1000000]
      longName: "Solar Azimuth"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle"
      source: variables/sensorAzimuthAngle
      chunks: [1000000]
      longName: "Bearing Or Azimuth"
      units: "degree"

    - name: "MetaData/sensorChannelNumber"
      source: variables/sensorChannelNumber
      longName: "Channel Number"

    # ObsValue
    - name: "ObsValue/heightOfLandSurface"
      source: variables/heightOfLandSurface
      chunks: [1000000]
      longName: "Height Of Land Surface"
      units: "m"

    - name: "ObsValue/brightnessTemperature"
      source: variables/brightnessTemperature
      longName: "Brightness Temperature (HIGH ACCURACY)"
      units: "K"

    - name: "ObsValue/coldSpaceTemperatureCorrection"
      source: variables/coldSpaceTemperatureCorrection
      longName: "Cold Space Temperature Correction"
      units: "K"
