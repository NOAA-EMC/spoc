bufr:
  subsets:
    - NC255101

  variables:
    # Not mapped: see the sequence notes in dev/ush/generate_bufr_tank_yamls.py
    #   */FILENAME/FNSTG

    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    receiptTime:
      datetime:
        year: "*/RCPTIM{1}/RCYR"
        month: "*/RCPTIM{1}/RCMO"
        day: "*/RCPTIM{1}/RCDY"
        hour: "*/RCPTIM{1}/RCHR"
        minute: "*/RCPTIM{1}/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    receiptTimeSignificance:
      query: "*/RCPTIM{1}/RCTS"

    restrictionFlag:
      query: "*/RSRD"

    restrictionExpiration:
      query: "*/EXPRSRD"

    stationIdentification:
      query: "*/RPID"

    providerIdentifier1:
      query: "*/PRVID{1}/PRVSTG"

    providerIdentifier2:
      query: "*/PRVID{2}/PRVSTG"

    platformType:
      query: "*/PLTTYP"

    stationElevation:
      query: "*/SELV"

    depthBelowLandSurface1:
      query: "*/MNSOMTSQ{1}/DBLS"

    depthBelowLandSurface2:
      query: "*/MNSOMTSQ{2}/DBLS"

    timePeriodHoursMntopcsq1:
      query: "*/MNTOPCSQ{1}/TPHR"

    timePeriodHoursMntopcsq2:
      query: "*/MNTOPCSQ{2}/TPHR"

    timePeriodHoursMntopcsq3:
      query: "*/MNTOPCSQ{3}/TPHR"

    timePeriodHoursMntopcsq4:
      query: "*/MNTOPCSQ{4}/TPHR"

    timePeriodHoursMndofssq1:
      query: "*/MNDOFSSQ{1}/TPHR"

    timePeriodHoursMndofssq2:
      query: "*/MNDOFSSQ{2}/TPHR"

    # ObsValue
    airTemperatureTMDB:
      query: "*/MNTMDBSQ/TMDB"

    dewPointTemperature:
      query: "*/MNTMDPSQ/TMDP"

    windDirection:
      query: "*/MNWDIRSQ/WDIR"

    windSpeed:
      query: "*/MNWSPDSQ/WSPD"

    soilMoistureAvailability1:
      query: "*/MNSOMTSQ{1}/WTNS"

    soilMoistureAvailability2:
      query: "*/MNSOMTSQ{2}/WTNS"

    soilTemperature1:
      query: "*/MNSOMTSQ{1}/STEMH"

    soilTemperature2:
      query: "*/MNSOMTSQ{2}/STEMH"

    totalPrecipitation1:
