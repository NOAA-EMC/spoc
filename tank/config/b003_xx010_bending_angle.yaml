    referenceLongitude:
      query: "*/CLONH"

    inDirectionOf0DegLongDistanceFromEarths3:
      query: "*/PD00"

    inDirectionOf90DegEDistanceFromEarthsCenter3:
      query: "*/PD90"

    earthRadiusCurvature:
