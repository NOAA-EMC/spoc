bufr:
  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteId:
      query: "*/SAID"

    cloudphase:
      query: "*/CLDP"

    heightbasecloud:
      query: "*/HOCB"

    heighttopcloud:
      query: "*/HOCT"

    pressbasecloud:
      query: "*/CDBP"

    presstopcloud:
      query: "*/CDTP"

    equivblckbodytemp:
      query: "*/EBBTH"

    verintegliqwatercontent:
      query: "*/VILWC"

encoder:
  globals:
    - name: "description"
      type: string
      value: "NASA Langley high-resolution (1x1 field-of-view) cloud data"

    - name: "platformCommonName"
      type: string
      value: "GOES or Himawari"

    - name: "platformLongDescription"
      type: string
      value: "Geostationary Operational Environmental Satellites/Himawari"
  
    - name: "sensorCommonName"
      type: string
      value: "ABI/AHI"

    - name: "sensorLongDescription"
      type: string
      value: "Advanced Baseline Imager (ABI)/ Advanced Himawari Imager (AHI) - a multi-channel passive imaging radiometer"

    - name: "source"
      type: string
      value: "NASA Langley Research Center"

    - name: "sourceFiles"
      type: string
      value: "GOES/Himawari Level 1b radiances and Level 2 cloud parameter files processed by NASA LaRC algorithms prior to BUFR encoding"

    - name: "processingLevel"
      type: string
      value: "Level 2 (L2) — Derived geophysical variables (e.g., cloud top temperature) mapped to the original satellite field-of-view"
  
    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteId
      longName: "Satellite Identifier"

    # ObsValue
    - name: "ObsValue/cloudphase"
      source: variables/cloudphase
      longName: "Cloud Phase"

    - name: "ObsValue/heightbasecloud"
      source: variables/heightbasecloud
      longName: "Height of Base of Cloud"
      units: "meters"

    - name: "ObsValue/heighttopcloud"
      source: variables/heighttopcloud
      longName: "Height of Top of Cloud"
      units: "meters"

    - name: "ObsValue/pressbasecloud"
      source: variables/pressbasecloud
      longName: "Pressure at Base of Cloud"
      units: "PA"

    - name: "ObsValue/presstopcloud"
      source: variables/presstopcloud
      longName: "Pressure at Top of Cloud"
      units: "PA"

    - name: "ObsValue/equivblckbodytemp"
      source: variables/equivblckbodytemp
      longName: "Equivalent Black Body Temperature"
      units: "kelvin"

    - name: "ObsValue/verintegliqwatercontent"
      source: variables/verintegliqwatercontent
      longName: "Vertically-Integrated Liquid Water Content"
      units: "Kg/(meter^2)"      
