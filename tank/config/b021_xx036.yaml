encoder:
  globals:
    - name: "description"
      type: string
      value: "MTYP 021-036 RARS(EARS,AP,SA) MHS 1C Tb DATA (N18-19)"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_mhs_rars"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "satelliteVariable"
      type: string
      value: "MetaData/satelliteIdentifier"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "036"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx036 NC021036"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/tovsAtovsProductIdentifier1"
      source: variables/tovsAtovsProductIdentifier1
      chunks: [1000000]
      longName: "TOVS/ATOVS Product Identifier"

    - name: "MetaData/dataProviderOrigin1"
      source: variables/dataProviderOrigin1
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/generatingSubCenter1"
      source: variables/generatingSubCenter1
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING SUB-CENTER"

    - name: "MetaData/tovsAtovsProductIdentifier2"
      source: variables/tovsAtovsProductIdentifier2
      chunks: [1000000]
      longName: "TOVS/ATOVS Product Identifier"

    - name: "MetaData/dataProviderOrigin2"
      source: variables/dataProviderOrigin2
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/generatingSubCenter2"
      source: variables/generatingSubCenter2
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING SUB-CENTER"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      chunks: [1000000]
      longName: "Satellite Identifier"

    - name: "MetaData/satelliteSensorIndicator"
      source: variables/satelliteSensorIndicator
      chunks: [1000000]
      longName: "Satellite Sensor Indicator"

    - name: "MetaData/orbitNumber"
      source: variables/orbitNumber
      chunks: [1000000]
      longName: "Orbit Number"

    - name: "MetaData/satelliteAntennaCorrectionsVersionNumber"
      source: variables/satelliteAntennaCorrectionsVersionNumber
      chunks: [1000000]
      longName: "Satellite Antenna Corrections Version Number"

    - name: "MetaData/scanLineNumber"
      source: variables/scanLineNumber
      chunks: [1000000]
      longName: "Scan Line Number"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
