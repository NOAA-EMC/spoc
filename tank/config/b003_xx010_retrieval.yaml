      longName: "Absolute Platform Velocity - First Component"
      units: "m s-1"

    - name: "MetaData/absolutePlatformVelocitySecondComponent2"
      source: variables/absolutePlatformVelocitySecondComponent2
      chunks: [1000000]
      longName: "Absolute Platform Velocity - Second Component"
