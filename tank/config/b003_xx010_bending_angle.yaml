    impactParameterRO3:
      query: "*/ROSEQ1/ROSEQ2{3}/IMPP"

    impactParameterRO4:
      query: "*/ROSEQ1/ROSEQ2{4}/IMPP"

    impactParameterRO5:
      query: "*/ROSEQ1/ROSEQ2{5}/IMPP"

    impactParameterRO6:
      query: "*/ROSEQ1/ROSEQ2{6}/IMPP"

