      query: "*/ATNCHV{3}/NEDTQW"

    noiseEquivalentDeltaTemperatureNedtQuality4:
      query: "*/ATNCHV{4}/NEDTQW"

    noiseEquivalentDeltaTemperatureNedtQuality5:
