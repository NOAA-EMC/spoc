bufr:
  subsets:
    - NC006070

  # One row per element of this sequence
  group_by_variable: distanceToGateCenter

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    aircraftFlightNumber:
      query: "*/ACID"

    aircraftTailNumber:
      query: "*/ACRN"

    stormIdentifier:
      query: "*/STMID"

    satelliteTransmitterId:
      query: "*/PTID"

    flightLevel:
      query: "*/FLVLST"

    antennaAzimuthAngle:
      query: "*/ANAZ"

    antennaElevationAngle:
      query: "*/ANEL"

    distanceToGateCenter:
      query: "*/NP3RW/DIST"

    # ObsValue
    horizontalReflectivity:
      query: "*/NP3RW/HREF"

    dopplerMeanRadialVelocity:
      query: "*/NP3RW/DMVR"

    dopplerVelocitySpectralWidth:
      query: "*/NP3RW/DVSW"

encoder:
  globals:
    - name: "description"
      type: string
      value: "M Type 006-070 P-3 Acft Tail Doppler Radar Radial Wind"

    - name: "dataCategory"
      type: string
      value: "radar"

    - name: "dataset"
      type: string
      value: "radar_aircraft_p3_wind"

    - name: "dataFormat"
      type: string
      value: "binary"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "006"

    - name: "bufrLocalSubcategory"
      type: string
      value: "070"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b006/xx070 NC006070"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/aircraftFlightNumber"
      source: variables/aircraftFlightNumber
      chunks: [1000000]
      longName: "Aircraft Flight Number"

    - name: "MetaData/aircraftTailNumber"
      source: variables/aircraftTailNumber
      chunks: [1000000]
      longName: "Aircraft Registration (TAIL) Number"

    - name: "MetaData/stormIdentifier"
      source: variables/stormIdentifier
      chunks: [1000000]
      longName: "Storm Identifier"

    - name: "MetaData/satelliteTransmitterId"
      source: variables/satelliteTransmitterId
      chunks: [1000000]
      longName: "Platform Transmitter Id Number (ANTENNA NUMBER)"

    - name: "MetaData/flightLevel"
      source: variables/flightLevel
      chunks: [1000000]
      longName: "Flight Level"
      units: "m"

    - name: "MetaData/antennaAzimuthAngle"
      source: variables/antennaAzimuthAngle
      chunks: [1000000]
      longName: "Antenna Azimuth Angle"
      units: "degree"

    - name: "MetaData/antennaElevationAngle"
      source: variables/antennaElevationAngle
      chunks: [1000000]
      longName: "Antenna Elevation Angle"
      units: "degree"

    - name: "MetaData/distanceToGateCenter"
      source: variables/distanceToGateCenter
      chunks: [1000000]
      longName: "Distance (FROM Antenna To Gate CENTER)"
      units: "m"

    # ObsValue
    - name: "ObsValue/horizontalReflectivity"
      source: variables/horizontalReflectivity
      chunks: [1000000]
      longName: "Horizontal Reflectivity"
      units: "dB"

    - name: "ObsValue/dopplerMeanRadialVelocity"
      source: variables/dopplerMeanRadialVelocity
      chunks: [1000000]
      longName: "Doppler Mean Radial Velocity"
      units: "m s-1"

    - name: "ObsValue/dopplerVelocitySpectralWidth"
      source: variables/dopplerVelocitySpectralWidth
      chunks: [1000000]
      longName: "Doppler Velocity Spectral Width"
      units: "m s-1"
