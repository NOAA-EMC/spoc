    - name: "MetaData/inDirectionOf0DegLongDistanceFromEarths3"
      source: variables/inDirectionOf0DegLongDistanceFromEarths3
      chunks: [1000000]
      longName: "In Direction Of 0 Deg LONG, Distance From EARTH'S Cent"
      units: "m"

    - name: "MetaData/inDirectionOf90DegEDistanceFromEarthsCenter3"
      source: variables/inDirectionOf90DegEDistanceFromEarthsCenter3
      chunks: [1000000]
      longName: "In Direction Of 90 Deg E, Distance From EARTH'S Center"
