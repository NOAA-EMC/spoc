bufr:
  group_by_variable: height 
  variables:
    # MetaData
#    timestamp:
#      datetime:
#        year: "*/YEAR"
#        month: "*/MNTH"
#        day: "*/DAYS"
#        hour: "*/HOUR"
#        minute: "*/MINU"
#        second: "*/SECO"

    satelliteId_height: #entifier:
      query: "*/SAID"
#    latitude:
#      query: "*/ROSEQ1/CLATH"
#    longitude:
#      query: "*/ROSEQ1/CLONH"
#      query: "*/GEODU"
    height:
      query: "*/ROSEQ3/HEIT"
    percentConfidence:
      query: "*/ROSEQ3/PCCF"

#    # ObsValue
    atmosphericRefractivity:
      query: "*/ROSEQ3/ARFR[1]"

    # ObsError
    obsErrorAtmosphericRefractivity:
      query: "*/ROSEQ3/ARFR[2]"

  splits:
    satId:
      category:
        variable: satelliteId_height
        map:
          _3: metop_3
          _4: metop_4
          _5: metop_5
          _42: tsx_42
          _43:  tdm_43
          _44:  paz_44
          _66:  s6_66
          _265: geoopt_265
          _266: geoopt_266
          _267: piq_267
          _268: piq_268          
          _269: spire_269
          _750: cosmic2_750
          _751: cosmic2_751
          _752: cosmic2_752
          _753: cosmic2_753
          _754: cosmic2_754
          _755: cosmic2_755
          _803: grace_803
          _804: grace_804
          _825: k5_825

