        # MINU is not in this subset; minute is treated as 0
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    receiptTime:
      datetime:
        year: "*/RCPTIM{1}/RCYR"
        month: "*/RCPTIM{1}/RCMO"
        day: "*/RCPTIM{1}/RCDY"
        hour: "*/RCPTIM{1}/RCHR"
        minute: "*/RCPTIM{1}/RCMI"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    receiptTimeSignificance:
      query: "*/RCPTIM{1}/RCTS"

    sequenceNumber:
      query: "*/BID{1}/SEQNUM"

    bulletinHeader:
      query: "*/BID{1}/BUHD"

    bulletinOriginator:
      query: "*/BID{1}/BORG"

    bulletinTime:
      query: "*/BID{1}/BULTIM"

    bulletinBBB:
      query: "*/BID{1}/BBB"

    stationIdentification:
      query: "*/RPID"

    stationElevation:
      query: "*/SELV"

    radiosondeType1:
      query: "*/UARID{1}/RATP"

    radiosondeType2:
      query: "*/UARID{2}/RATP"

    measuringEquipmentType1:
      query: "*/UARID{1}/A4ME"

    measuringEquipmentType2:
      query: "*/UARID{2}/A4ME"

    radiosondePartName1:
      query: "*/UARID{1}/UAPART"

    radiosondePartName2:
      query: "*/UARID{2}/UAPART"

    windInstrumentationType1:
      query: "*/UARID{1}/TIWM"

    windInstrumentationType2:
