bufr:
  subsets:
    - NC021036

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    tovsAtovsProductIdentifier1:
      query: "*/TAPQ[1]"

    dataProviderOrigin1:
      query: "*/OGCE[1]"

    generatingSubCenter1:
      query: "*/GSES[1]"

    tovsAtovsProductIdentifier2:
      query: "*/TAPQ[2]"

    dataProviderOrigin2:
      query: "*/OGCE[2]"

    generatingSubCenter2:
      query: "*/GSES[2]"

    satelliteIdentifier:
      query: "*/SAID"

    satelliteSensorIndicator:
      query: "*/SSIN"

    orbitNumber:
      query: "*/ORBN"

    satelliteAntennaCorrectionsVersionNumber:
      query: "*/SACV"

    scanLineNumber:
      query: "*/SLNM"

    sensorScanPosition:
      query: "*/FOVN"

    majorFrameCount:
      query: "*/MJFC"

    stationElevation:
      query: "*/SELV"

    satelliteZenithAngle:
      query: "*/SAZA"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    solarZenithAngle:
      query: "*/SOZA"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    radiometerIdentifier1:
      query: "*/RAID[1]"

    radiometerIdentifier2:
      query: "*/RAID[2]"

    radiometerIdentifier3:
      query: "*/RAID[3]"

    radiometerIdentifier4:
      query: "*/RAID[4]"

    sensorChannelNumber1:
      query: "*/ATNCHV{1}/INCN"

    sensorChannelNumber2:
      query: "*/ATNCHV{2}/INCN"

    sensorChannelNumber3:
      query: "*/ATNCHV{3}/INCN"

    sensorChannelNumber4:
      query: "*/ATNCHV{4}/INCN"

    sensorChannelNumber5:
      query: "*/ATNCHV{5}/INCN"

    log10OfTemperatureRadianceCentralWavenumber1:
      query: "*/ATNCHV{1}/LOGRCW"

    log10OfTemperatureRadianceCentralWavenumber2:
      query: "*/ATNCHV{2}/LOGRCW"

    log10OfTemperatureRadianceCentralWavenumber3:
      query: "*/ATNCHV{3}/LOGRCW"

    log10OfTemperatureRadianceCentralWavenumber4:
      query: "*/ATNCHV{4}/LOGRCW"

    log10OfTemperatureRadianceCentralWavenumber5:
      query: "*/ATNCHV{5}/LOGRCW"

    bandwidthCorrectionCoefficient1ForAtovs1:
      query: "*/ATNCHV{1}/BWCC1"

    bandwidthCorrectionCoefficient1ForAtovs2:
      query: "*/ATNCHV{2}/BWCC1"

    bandwidthCorrectionCoefficient1ForAtovs3:
      query: "*/ATNCHV{3}/BWCC1"

    bandwidthCorrectionCoefficient1ForAtovs4:
      query: "*/ATNCHV{4}/BWCC1"

    bandwidthCorrectionCoefficient1ForAtovs5:
      query: "*/ATNCHV{5}/BWCC1"

    bandwidthCorrectionCoefficient2ForAtovs1:
      query: "*/ATNCHV{1}/BWCC2"

    bandwidthCorrectionCoefficient2ForAtovs2:
      query: "*/ATNCHV{2}/BWCC2"

    bandwidthCorrectionCoefficient2ForAtovs3:
      query: "*/ATNCHV{3}/BWCC2"

    bandwidthCorrectionCoefficient2ForAtovs4:
      query: "*/ATNCHV{4}/BWCC2"

    bandwidthCorrectionCoefficient2ForAtovs5:
      query: "*/ATNCHV{5}/BWCC2"

    softwareIdentification:
      query: "*/SWID"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    receiptTimeSignificance:
      query: "*/RCTS"

    # ObsValue
    instrumentTemperature1:
      query: "*/TMINST[1]"

    instrumentTemperature2:
      query: "*/TMINST[2]"

    instrumentTemperature3:
      query: "*/TMINST[3]"

    instrumentTemperature4:
      query: "*/TMINST[4]"

