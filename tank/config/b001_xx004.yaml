encoder:
  dimensions:
    - name: RawReportChunk
      path: "*/RAWRPT"

  globals:
    - name: "description"
      type: string
      value: "Message Type 001-004 Surface Marine Cman (CMAN)"

    - name: "dataCategory"
      type: string
      value: "surface marine"

    - name: "dataset"
      type: string
      value: "surface_cman"

    - name: "dataFormat"
      type: string
      value: "CMAN"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "001"

    - name: "bufrLocalSubcategory"
      type: string
      value: "004"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b001/xx004 NC001004"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

