bufr:
  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    amplitudeofstrike:
      query: "*/AMPLS"

    polarityofstroke:
      query: "*/PLRTS"

    numberofflashes:
      query: "*/NOFL"

    restrictionFlag:
      query: "*/RSRD"

    restrictionExpiration:
      query: "*/EXPRSRD"

encoder:
  globals:
    - name: "description"
      type: string
      value: "Total lightning strike and flash data"

    - name: "platformCommonName"
      type: string
      value: "Lightning Detection Network (LDN)"

    - name: "platformLongDescription"
      type: string
      value: "Ground-based lightning detection networks"

    - name: "sensorCommonName"
      type: string
      value: "Lightning Sensors / GLM"

    - name: "sensorLongDescription"
      type: string
      value: "Ground sensors using Magnetic Direction Finding (MDF) and Time-of-Arrival (TOA) techniques to detect electromagnetic pulses"

    - name: "source"
      type: string
      value: "Commercial vendors (Vaisala, Earth Networks)"

    - name: "sourceFiles"
      type: string
      value: "Binary or ASCII format defined by Vaisala"

    - name: "processingLevel"
      type: string
      value: "Level 2 (L2) — Derived geophysical parameters (discrete lightning flash/strike points)"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/restrictionFlag"
      source: variables/restrictionFlag
      longName: "Restriction on Redistribution"

    - name: "MetaData/restrictionExpiration"
      source: variables/restrictionExpiration
      longName: "Expiration of Restriction on Redistribution"

    # ObsValue
    - name: "ObsValue/amplitudeofstrike"
      source: variables/amplitudeofstrike
      longName: "Amplitude of Stroke"
      units: "AMPS"

    - name: "ObsValue/polarityofstroke"
      source: variables/polarityofstroke
      longName: "Polarity of Stroke"

#    - name: "ObsValue/otherweatherphenomena"
#      source: variables/otherweatherphenomena
#      longName: "Other Weather Phenomena"

    - name: "ObsValue/numberofflashes"
      source: variables/numberofflashes
      longName: "Number of Flashes"
      units: "NUMERIC"
