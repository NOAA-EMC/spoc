    - name: "MetaData/absolutePlatformVelocityThirdComponent2"
      source: variables/absolutePlatformVelocityThirdComponent2
      chunks: [1000000]
      longName: "Absolute Platform Velocity - Third Component"
      units: "m s-1"

    - name: "MetaData/timeIncrement"
      source: variables/timeIncrement
      chunks: [1000000]
