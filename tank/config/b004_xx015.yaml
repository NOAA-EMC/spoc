bufr:
  subsets:
    - NC004015

  variables:
    # Not mapped: bufr-query cannot parse these "."-prefixed mnemonics
    #   */.DTSPKWD
    #   */.DTSPKSW

    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    receiptTimeSignificance:
      query: "*/RCTS"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    stationIdentification:
      query: "*/RPID"

    flightLevel:
      query: "*/FLVL"

    pressureAltitude:
      query: "*/PSAL"

    rawReportString:
      query: "*/RAWRPT/RRSTG"

    pressure:
      query: "*/PRLC"

    # ObsValue
    airTemperatureTMDB:
      query: "*/TMDB"

    windDirection:
      query: "*/WDIR"

    windSpeed:
      query: "*/WSPD"

    dewPointTemperature:
      query: "*/TMDP"

    relativeHumidity:
      query: "*/REHU"

    geopotential10:
      query: "*/GP10"

    pressureReducedToMeanSeaLevel:
      query: "*/PMSL"

    peakWindSpeed:
      query: "*/PKWDSP"

    peakSurfaceWindSpeed:
      query: "*/PKSWSP"

    totalRainRate:
      query: "*/TRRT"

    # QualityMarker
    correctedReportIndicator:
      query: "*/CORN"

    airTemperature:
      query: "*/QMAT"

    wind:
      query: "*/QMWN"

    moisture:
      query: "*/QMDD"

    qualityForHdobPositional:
      query: "*/QHDOP"

    qualityForHdobMeterologicalStatus:
      query: "*/QHDOM"

    # Not in this tank: other tanks in this dataset have these
    verticalSoundingSignificance:
      query: "*/ABSENT"
      type: int

    dayOfTheWeek:
      query: "*/ABSENT"
      type: int

    cloudAmount1:
      query: "*/ABSENT"
      type: int

    cloudAmount2:
      query: "*/ABSENT"
      type: int

    cloudAmount3:
      query: "*/ABSENT"
      type: int

    cloudAmount4:
      query: "*/ABSENT"
      type: int

    cloudAmount5:
      query: "*/ABSENT"
      type: int

    cloudAmount6:
      query: "*/ABSENT"
      type: int

    cloudType1:
      query: "*/ABSENT"
      type: int

    cloudType2:
      query: "*/ABSENT"
      type: int

    cloudType3:
      query: "*/ABSENT"
      type: int

    cloudType4:
      query: "*/ABSENT"
      type: int

    cloudType5:
      query: "*/ABSENT"
      type: int

    cloudType6:
      query: "*/ABSENT"
      type: int

    heightbasecloud1:
      query: "*/ABSENT"
      type: int

    heightbasecloud2:
      query: "*/ABSENT"
      type: int

    heightbasecloud3:
      query: "*/ABSENT"
      type: int

    heightbasecloud4:
      query: "*/ABSENT"
      type: int

    heightbasecloud5:
      query: "*/ABSENT"
      type: int

    heightbasecloud6:
      query: "*/ABSENT"
      type: int

    heightOfTopOfCloud1:
      query: "*/ABSENT"
      type: int

    heightOfTopOfCloud2:
      query: "*/ABSENT"
      type: int

    heightOfTopOfCloud3:
      query: "*/ABSENT"
      type: int

    heightOfTopOfCloud4:
      query: "*/ABSENT"
      type: int

    heightOfTopOfCloud5:
      query: "*/ABSENT"
      type: int

    heightOfTopOfCloud6:
      query: "*/ABSENT"
      type: int

    airframeIcing:
      query: "*/ABSENT"
      type: int

    heightOfBaseOfIcing:
      query: "*/ABSENT"
      type: int

    heightOfTopOfIcing:
      query: "*/ABSENT"
      type: int

    surfaceWindDirection:
      query: "*/ABSENT"
      type: int

    surfaceWindSpeed:
      query: "*/ABSENT"
      type: float

    degreeOfTurbulence:
      query: "*/ABSENT"
      type: int

    presentWeather:
      query: "*/ABSENT"
      type: int

    horizontalVisibility:
      query: "*/ABSENT"
      type: int

    seaSurfaceTemperatureSST1:
      query: "*/ABSENT"
      type: float

    seaSurfaceTemperature:
      query: "*/ABSENT"
      type: int

encoder:
  dimensions:
    - name: RawReportChunk
      path: "*/RAWRPT"

  globals:
    - name: "description"
      type: string
      value: "MTYP 004-015 High density recconnaissance obs (HDOB)"

    - name: "dataCategory"
      type: string
      value: "single level upper-air data other than satellite"

    - name: "dataset"
      type: string
      value: "aircraft_recon"

    - name: "dataFormat"
      type: string
      value: "HDOB"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "004"

    - name: "bufrLocalSubcategory"
      type: string
      value: "015"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b004/xx015 NC004015"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      chunks: [1000000]
      longName: "Receipt Time Significance"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      chunks: [1000000]
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      chunks: [1000000]
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      chunks: [1000000]
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      chunks: [1000000]
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      chunks: [1000000]
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      chunks: [1000000]
      longName: "Report Identifier"

    - name: "MetaData/flightLevel"
      source: variables/flightLevel
      chunks: [1000000]
      longName: "Flight Level"
      units: "m"

    - name: "MetaData/pressureAltitude"
      source: variables/pressureAltitude
      chunks: [1000000]
      longName: "Pressure Altitude Relative To Mean Sea Level"
      units: "m"

    - name: "MetaData/rawReportString"
      source: variables/rawReportString
      longName: "Raw Report String"

    - name: "MetaData/pressure"
      source: variables/pressure
      chunks: [1000000]
      longName: "Pressure"
      units: "Pa"

    # ObsValue
    - name: "ObsValue/airTemperatureTMDB"
      source: variables/airTemperatureTMDB
      chunks: [1000000]
      longName: "TEMPERATURE/DRY Bulb Temperature"
      units: "K"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      chunks: [1000000]
      longName: "Wind Direction"
      units: "degree"

    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      chunks: [1000000]
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/dewPointTemperature"
      source: variables/dewPointTemperature
      chunks: [1000000]
      longName: "Dew Point Temperature"
      units: "K"

    - name: "ObsValue/relativeHumidity"
      source: variables/relativeHumidity
      chunks: [1000000]
      longName: "Relative Humidity"
      units: "%"

    - name: "ObsValue/geopotential10"
      source: variables/geopotential10
      chunks: [1000000]
      longName: "Geopotential"
      units: "m2 s-2"

    - name: "ObsValue/pressureReducedToMeanSeaLevel"
      source: variables/pressureReducedToMeanSeaLevel
      chunks: [1000000]
      longName: "Pressure At Mean Sea Level"
      units: "Pa"

    - name: "ObsValue/peakWindSpeed"
      source: variables/peakWindSpeed
      chunks: [1000000]
      longName: "Peak Wind Speed"
      units: "m s-1"

    - name: "ObsValue/peakSurfaceWindSpeed"
      source: variables/peakSurfaceWindSpeed
      chunks: [1000000]
      longName: "Peak Surface Wind Speed"
      units: "m s-1"

    - name: "ObsValue/totalRainRate"
      source: variables/totalRainRate
      chunks: [1000000]
      longName: "Total Rain Rate"
      units: "mm h-1"

    # QualityMarker
    - name: "QualityMarker/correctedReportIndicator"
      source: variables/correctedReportIndicator
      chunks: [1000000]
      longName: "Corrected Report Indicator"

    - name: "QualityMarker/airTemperature"
      source: variables/airTemperature
      chunks: [1000000]
      longName: "Sdmedit Quality Mark For Temperature"

    - name: "QualityMarker/wind"
      source: variables/wind
      chunks: [1000000]
      longName: "Sdmedit Quality Mark For Wind"

    - name: "QualityMarker/moisture"
      source: variables/moisture
      chunks: [1000000]
      longName: "Sdmedit Quality Mark For Moisture"

    - name: "QualityMarker/qualityForHdobPositional"
      source: variables/qualityForHdobPositional
      chunks: [1000000]
      longName: "Quality For Hdob Positional"

    - name: "QualityMarker/qualityForHdobMeterologicalStatus"
      source: variables/qualityForHdobMeterologicalStatus
      chunks: [1000000]
      longName: "Quality For Hdob Meterological Status"

    # Not in this tank: read as missing so the dataset has one set of variables
    - name: "MetaData/verticalSoundingSignificance"
      source: variables/verticalSoundingSignificance
      chunks: [1000000]
      longName: "Vertical Sounding Significance"

    - name: "MetaData/dayOfTheWeek"
