time window:
  begin: "2018-04-14T21:00:00Z"
  end: "2025-12-15T03:00:00Z"

observations:
- obs space:
    name: "metop"
    observed variables: [bendingAngle]
    derived variables: [bendingAngle]
    simulated variables: [bendingAngle]
    obsdatain:
      engine:
        type: script 
        script file: "bufr_gpsro.py"
        args:
          input: "./testinput/2024122500/gdas.t00z.gpsro.tm00.bufr_d"
          category: 'metop'
          cache categories:
            - "metop"
            - "cosmic"
            - "tdm"
            - "grace"
            - "geoopt"
            - "piq"
            - "k5"
            - "paz"
            - "s6"
            - "tsx"
            - "spire"
    obsdataout:
      engine:
        type: H5File
        obsfile: "./testoutput/2024122500/script4backend/gdas.t00z.gpsro_metop.tm00.nc"

