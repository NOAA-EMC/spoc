bufr:
  subsets:
    - NC002017

  # One row per element of this sequence
  group_by_variable: height

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    latitude:
      query: "*/CLAT"

    longitude:
      query: "*/CLON"

    stationIdentification:
      query: "*/RPID"

    stationElevation:
      query: "*/SELV"

    height:
      query: "*/NXVADD2/HEIT"

    # ObsValue
    windEastward:
      query: "*/NXVADD2/UWND"

    windNorthward:
      query: "*/NXVADD2/VWND"

    # QualityMarker
    correctedReportIndicator:
      query: "*/CORN"

    wind:
      query: "*/NXVADD2/QMWN"

    qualityFlagForVadWindsGeneratedFromLvl2:
      query: "*/NXVADD2/QFV2"

encoder:
  globals:
    - name: "description"
      type: string
      value: "MSG TYPE 002-017 NeXRaD VAD WINDS FROM LEVEL 2 DECODER"

    - name: "dataCategory"
      type: string
      value: "vertical soundings other than satellite"

    - name: "dataset"
      type: string
      value: "vad_nexrad"

    - name: "dataFormat"
      type: string
      value: "binary"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "002"

    - name: "bufrLocalSubcategory"
      type: string
      value: "017"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b002/xx017 NC002017"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      chunks: [1000000]
      longName: "Report Identifier"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      chunks: [1000000]
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/height"
      source: variables/height
      chunks: [1000000]
      longName: "Height"
      units: "m"

    # ObsValue
    - name: "ObsValue/windEastward"
      source: variables/windEastward
      chunks: [1000000]
      longName: "U-COMPONENT Of Wind"
      units: "m s-1"

    - name: "ObsValue/windNorthward"
      source: variables/windNorthward
      chunks: [1000000]
      longName: "V-COMPONENT Of Wind"
      units: "m s-1"

    # QualityMarker
    - name: "QualityMarker/correctedReportIndicator"
      source: variables/correctedReportIndicator
      chunks: [1000000]
      longName: "Corrected Report Indicator"

    - name: "QualityMarker/wind"
      source: variables/wind
      chunks: [1000000]
      longName: "Sdmedit Quality Mark For Wind"

    - name: "QualityMarker/qualityFlagForVadWindsGeneratedFromLvl2"
      source: variables/qualityFlagForVadWindsGeneratedFromLvl2
      chunks: [1000000]
      longName: "Quality Flag For Vad Winds Generated From Lvl 2 Decode"
