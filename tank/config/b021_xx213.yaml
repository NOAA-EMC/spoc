bufr:
  subsets:
    - NC021213

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteIdentifier:
      query: "*/SAID"

    dataProviderOrigin:
      query: "*/OGCE"

    generatingSubCenter:
      query: "*/GSES"

    instrumentIdentifier:
      query: "*/SIID"

    satelliteConstellationRO:
      query: "*/SCLF"

    orbitNumber:
      query: "*/ORBN"

    scanLineNumber:
      query: "*/SLNM"

    sensorScanPosition:
      query: "*/FOVN"

    heightOfStation:
      query: "*/HMSL"

    satelliteZenithAngle:
      query: "*/SAZA"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    solarZenithAngle:
      query: "*/SOZA"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    satelliteAntennaCorrectionsVersionNumber:
      query: "*/SACV"

    sensorChannelNumber:
      query: "*/ATMSCH/CHNM"

    sensorCentralFrequency:
      query: "*/ATMSCH/SCCF"

    sensorBandWidth:
      query: "*/ATMSCH/SCBW"

    antennaPolarization:
      query: "*/ATMSCH/ANPO"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    receiptTimeSignificance:
      query: "*/RCTS"

    # ObsValue
    antennaTemperature:
      query: "*/ATMSCH/TMANT"

    brightnessTemperature:
      query: "*/ATMSCH/TMBR"

    noiseEquivDeltaTemperatureWhileViewingCold:
      query: "*/ATMSCH/NEDTCO"

    noiseEquivDeltaTemperatureWhileViewingWarm:
      query: "*/ATMSCH/NEDTWA"

    # QualityMarker
    granuleLevelQualityFlags:
      query: "*/ATMSGQ"

    scanLevelQualityFlags:
      query: "*/ATMSSQ"

    geolocationQuality:
      query: "*/NGQI"

    channelDataQualityFlags:
      query: "*/ATMSCH/ATMSCHQ"

encoder:
  dimensions:
    - name: Channel
      source: variables/sensorChannelNumber
      path: "*/ATMSCH"

  globals:
    - name: "description"
      type: string
      value: "MTYP 021-213 ATMS BRIGHT. TEMPS (direct broadcast)"

    - name: "dataCategory"
      type: string
      value: "radiances from satellite"

    - name: "dataset"
      type: string
      value: "radiance_atms"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "satelliteVariable"
      type: string
      value: "MetaData/satelliteIdentifier"

    - name: "bufrCategory"
      type: string
      value: "021"

    - name: "bufrLocalSubcategory"
      type: string
      value: "213"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b021/xx213 NC021213"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      chunks: [1000000]
      longName: "Satellite Identifier"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/generatingSubCenter"
      source: variables/generatingSubCenter
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING SUB-CENTER"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      chunks: [1000000]
      longName: "Satellite Instruments"

    - name: "MetaData/satelliteConstellationRO"
      source: variables/satelliteConstellationRO
      chunks: [1000000]
      longName: "Satellite Classification"

    - name: "MetaData/orbitNumber"
      source: variables/orbitNumber
      chunks: [1000000]
      longName: "Orbit Number"

    - name: "MetaData/scanLineNumber"
      source: variables/scanLineNumber
      chunks: [1000000]
      longName: "Scan Line Number"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      chunks: [1000000]
      longName: "Field Of View Number"

    - name: "MetaData/heightOfStation"
      source: variables/heightOfStation
      chunks: [1000000]
      longName: "Height Or Altitude"
      units: "m"

    - name: "MetaData/satelliteZenithAngle"
      source: variables/satelliteZenithAngle
      chunks: [1000000]
      longName: "Satellite Zenith Angle"
      units: "degree"

    - name: "MetaData/sensorAzimuthAngle"
      source: variables/sensorAzimuthAngle
      chunks: [1000000]
      longName: "Bearing Or Azimuth"
      units: "degree"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      chunks: [1000000]
      longName: "Solar Zenith Angle"
      units: "degree"

    - name: "MetaData/solarAzimuthAngle"
      source: variables/solarAzimuthAngle
      chunks: [1000000]
      longName: "Solar Azimuth"
      units: "degree"

    - name: "MetaData/satelliteAntennaCorrectionsVersionNumber"
      source: variables/satelliteAntennaCorrectionsVersionNumber
      chunks: [1000000]
      longName: "Satellite Antenna Corrections Version Number"

    - name: "MetaData/sensorChannelNumber"
      source: variables/sensorChannelNumber
      longName: "Channel Number"

    - name: "MetaData/sensorCentralFrequency"
      source: variables/sensorCentralFrequency
      longName: "Satellite Channel Center Frequency"
      units: "Hz"

    - name: "MetaData/sensorBandWidth"
      source: variables/sensorBandWidth
      longName: "Satellite Channel Band Width"
      units: "Hz"

    - name: "MetaData/antennaPolarization"
      source: variables/antennaPolarization
      longName: "Antenna Polarization"

    - name: "MetaData/sequenceNumber"
      source: variables/sequenceNumber
      chunks: [1000000]
      longName: "Channel Sequence Number"

    - name: "MetaData/bulletinHeader"
      source: variables/bulletinHeader
      chunks: [1000000]
      longName: "BULLETIN BEING MONITORED (TTAAii)"

    - name: "MetaData/bulletinOriginator"
      source: variables/bulletinOriginator
      chunks: [1000000]
      longName: "Bulletin Being Monitored (CCCC)"

    - name: "MetaData/bulletinTime"
      source: variables/bulletinTime
      chunks: [1000000]
      longName: "BULLETIN BEING MONITORED (YYGGgg)"

    - name: "MetaData/bulletinBBB"
      source: variables/bulletinBBB
      chunks: [1000000]
      longName: "Bulletin Being Monitored (BBB)"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      chunks: [1000000]
      longName: "Receipt Time Significance"

    # ObsValue
    - name: "ObsValue/antennaTemperature"
      source: variables/antennaTemperature
      longName: "Antenna Temperature"
      units: "K"

    - name: "ObsValue/brightnessTemperature"
      source: variables/brightnessTemperature
      longName: "Brightness Temperature"
      units: "K"

    - name: "ObsValue/noiseEquivDeltaTemperatureWhileViewingCold"
      source: variables/noiseEquivDeltaTemperatureWhileViewingCold
      longName: "NOISE-EQUIV. Delta Temperature While Viewing Cold Targ"
      units: "K"

    - name: "ObsValue/noiseEquivDeltaTemperatureWhileViewingWarm"
      source: variables/noiseEquivDeltaTemperatureWhileViewingWarm
      longName: "NOISE-EQUIV. Delta Temperature While Viewing Warm Targ"
      units: "K"

    # QualityMarker
    - name: "QualityMarker/granuleLevelQualityFlags"
      source: variables/granuleLevelQualityFlags
      chunks: [1000000]
      longName: "Granule Level Quality Flags"

    - name: "QualityMarker/scanLevelQualityFlags"
      source: variables/scanLevelQualityFlags
      chunks: [1000000]
      longName: "Scan Level Quality Flags"

    - name: "QualityMarker/geolocationQuality"
      source: variables/geolocationQuality
      chunks: [1000000]
      longName: "Geolocation Quality"

    - name: "QualityMarker/channelDataQualityFlags"
      source: variables/channelDataQualityFlags
      longName: "Channel Data Quality Flags"
