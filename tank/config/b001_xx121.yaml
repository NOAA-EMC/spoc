bufr:
  subsets:
    - NC001121

  # One row per element of this sequence
  group_by_variable: depthBelowSeaSurface

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    stationIdentification:
      query: "*/RPID"

    wmoMarineObservingPlatformExtendedIdentifier:
      query: "*/WMOP"

    wmoRegionNumber:
      query: "*/WMOR"

    wmoRegionSubArea:
      query: "*/WMORS4"

    wigosIdentifierSeries:
      query: "*/WGOSIDS"

    wigosIssuerOfIdentifier:
      query: "*/WGOSISID"

    wigosIssueNumber:
      query: "*/WGOSISNM"

    wigosLocalIdentifierCharacter:
      query: "*/WGOSLID"

    buoyPlatformIdentifier:
      query: "*/BPID"

    stationLongName:
      query: "*/LSTN"

    buoyType:
      query: "*/BUYT"

    timeSignificance1:
      query: "*/TSIG[1]"

    platformTransmitterIdNumber:
      query: "*/PTIDC"

    surfaceType:
      query: "*/RSST"

    precisionOfTemperatureObservation:
      query: "*/PCAT"

    indicatorForDigitization:
      query: "*/IDMSMDBS/IDGT"

    methodOfSalinityDepthMeasurementIdmsmdbs:
      query: "*/IDMSMDBS/MSDM"

    depthBelowSeaSurface:
      query: "*/IDMSMDBS/BBYSTSL/DBSS"

    precisionOfTemperatureObservationBbyssts:
      query: "*/BBYSSTS/PCAT"

    methodOfSalinityDepthMeasurementBbyssts:
      query: "*/BBYSSTS/MSDM"

    heightOfSensorAboveWater:
      query: "*/HSAWS"

    anemometerType:
      query: "*/ANTP"

    heightOfSensorAboveWater2:
      query: "*/HSAWS"

    timeSignificance:
      query: "*/TSIG"

    timePeriodMinutes:
      query: "*/TPMI"

    timeSignificance2:
      query: "*/TSIG[2]"

    year:
      query: "*/YEAR"

    month:
      query: "*/MNTH"

    day:
      query: "*/DAYS"

    hour:
      query: "*/HOUR"

    minute:
      query: "*/MINU"

    dataCollectionAndOrLocationSystem:
      query: "*/DCLS"

    dirOfMotionOfMovingObservingPlatform:
      query: "*/DOMO"

    platformDriftSpeedHighPrecision:
      query: "*/PLDS"

    batteryVoltageLargeRange:
      query: "*/BVOLH"

    drogueType:
      query: "*/DROT"

    depthAtWhichDrogueIsAttached:
      query: "*/DROD"

    lagrangianDrifterSubmergence:
      query: "*/LDRS"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    receiptTimeSignificance:
      query: "*/RCTS"

    restrictionFlag:
      query: "*/RSRD"

    restrictionExpiration:
      query: "*/EXPRSRD"

    # ObsValue
    iceThickness:
      query: "*/ITHK"

    seaSurfaceTemperatureSST1:
      query: "*/IDMSMDBS/BBYSTSL/SST1"

    salinity:
      query: "*/IDMSMDBS/BBYSTSL/SALN"

    seaSurfaceTemperatureSST0:
      query: "*/BBYSSTS/SST0"

    seaSurfaceSalinity:
      query: "*/BBYSSTS/SSS0"

    durationOfWaveRecord:
      query: "*/BASICWAV/DOWR"

    significantWaveHeight:
      query: "*/BASICWAV/SGWH"

    maximumWaveHeight:
      query: "*/BASICWAV/MXWH"

    averageWavePeriod:
      query: "*/BASICWAV/AVWP"

    spectralPeakWavePeriod:
      query: "*/BASICWAV/SPWP"

    directionFromWhichDominantWavesAreComing:
      query: "*/BASICWAV/DDWC"

    directionalSpreadOfDominantWave:
      query: "*/BASICWAV/DSDW"

    airPressure:
      query: "*/PRES"

    pressureReducedToMeanSeaLevel:
      query: "*/PMSL"

    pressureChange3Hour:
      query: "*/3HPC"

    pressureTendencyCharacteristic:
      query: "*/CHPT"

    airTemperatureTMDB:
      query: "*/TMDB"

    dewPointTemperature:
      query: "*/TMDP"

    relativeHumidity:
      query: "*/REHU"

    windDirection:
      query: "*/WDIR"

    windSpeed:
      query: "*/WSPD"

    lagrangianDrifterDrogueStatus:
      query: "*/LDDS"

    # QualityMarker
    seaSurfaceTemperature:
      query: "*/QMST"

    pressure:
      query: "*/QMPR"

    airTemperature:
      query: "*/QMAT"

    qualityOfBuoySatelliteTransmission:
      query: "*/QBST"

    qualityOfBuoyLocation:
      query: "*/QCIL"

    locationQualityClass:
      query: "*/QCLS"

    correctedReportIndicator:
      query: "*/CORN"

encoder:
  globals:
    - name: "description"
      type: string
      value: "Message Type 001-121 Surface Marine SOFAR,RESTRCTD(BUFR"

    - name: "dataCategory"
      type: string
      value: "surface marine"

    - name: "dataset"
      type: string
      value: "surface_sofar_restricted"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "true"

    - name: "bufrCategory"
      type: string
      value: "001"

    - name: "bufrLocalSubcategory"
      type: string
      value: "121"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b001/xx121 NC001121"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      chunks: [1000000]
      longName: "Report Identifier"

    - name: "MetaData/wmoMarineObservingPlatformExtendedIdentifier"
      source: variables/wmoMarineObservingPlatformExtendedIdentifier
      chunks: [1000000]
      longName: "WMO marine observing platform extended identifier"

    - name: "MetaData/wmoRegionNumber"
      source: variables/wmoRegionNumber
      chunks: [1000000]
      longName: "Wmo Region Number"

    - name: "MetaData/wmoRegionSubArea"
      source: variables/wmoRegionSubArea
      chunks: [1000000]
      longName: "WMO Region sub-area"

    - name: "MetaData/wigosIdentifierSeries"
      source: variables/wigosIdentifierSeries
      chunks: [1000000]
      longName: "Wigos Identifier Series"

    - name: "MetaData/wigosIssuerOfIdentifier"
      source: variables/wigosIssuerOfIdentifier
      chunks: [1000000]
      longName: "Wigos Issuer Of Identifier"

    - name: "MetaData/wigosIssueNumber"
      source: variables/wigosIssueNumber
      chunks: [1000000]
      longName: "Wigos Issue Number"

    - name: "MetaData/wigosLocalIdentifierCharacter"
      source: variables/wigosLocalIdentifierCharacter
      chunks: [1000000]
      longName: "Wigos Local Identifier (CHARACTER)"

    - name: "MetaData/buoyPlatformIdentifier"
      source: variables/buoyPlatformIdentifier
      chunks: [1000000]
      longName: "BUOY/PLATFORM Identifier"

    - name: "MetaData/stationLongName"
      source: variables/stationLongName
      chunks: [1000000]
      longName: "Long station or site name"

    - name: "MetaData/buoyType"
      source: variables/buoyType
      chunks: [1000000]
      longName: "Buoy Type"

    - name: "MetaData/timeSignificance1"
      source: variables/timeSignificance1
      chunks: [1000000]
      longName: "Time Significance"

    - name: "MetaData/platformTransmitterIdNumber"
      source: variables/platformTransmitterIdNumber
      chunks: [1000000]
      longName: "Platform transmitter ID number"

    - name: "MetaData/surfaceType"
      source: variables/surfaceType
      chunks: [1000000]
      longName: "Surface type"

    - name: "MetaData/precisionOfTemperatureObservation"
      source: variables/precisionOfTemperatureObservation
      chunks: [1000000]
      longName: "Precision of temperature observation"
      units: "K"

    - name: "MetaData/indicatorForDigitization"
      source: variables/indicatorForDigitization
      chunks: [1000000]
      longName: "Indicator for digitization"

    - name: "MetaData/methodOfSalinityDepthMeasurementIdmsmdbs"
      source: variables/methodOfSalinityDepthMeasurementIdmsmdbs
      chunks: [1000000]
      longName: "Method Of SALINITY/DEPTH Measurement"

    - name: "MetaData/depthBelowSeaSurface"
      source: variables/depthBelowSeaSurface
      chunks: [1000000]
      longName: "Depth Below Sea Surface"
      units: "m"

    - name: "MetaData/precisionOfTemperatureObservationBbyssts"
      source: variables/precisionOfTemperatureObservationBbyssts
      chunks: [1000000]
