encoder:
  globals:
    - name: "description"
      type: string
      value: "MTYP 255-101 Coop from MADIS: NEPP & HCN-Modrnzd- NOA"

    - name: "dataCategory"
      type: string
      value: "other"

    - name: "dataset"
      type: string
      value: "surface_coop_madis_hcn-nepp"

    - name: "dataFormat"
      type: string
      value: "netCDF"

    - name: "restricted"
      type: string
      value: "true"

    - name: "bufrCategory"
      type: string
      value: "255"

    - name: "bufrLocalSubcategory"
      type: string
      value: "101"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b255/xx101 NC255101"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/receiptTimeSignificance"
      source: variables/receiptTimeSignificance
      chunks: [1000000]
      longName: "Receipt Time Significance"

    - name: "MetaData/restrictionFlag"
      source: variables/restrictionFlag
      chunks: [1000000]
      longName: "Restrictions On Redistribution"

    - name: "MetaData/restrictionExpiration"
      source: variables/restrictionExpiration
      chunks: [1000000]
      longName: "Expiration Of Restrictions On Redistribution"
      units: "h"

    - name: "MetaData/stationIdentification"
      source: variables/stationIdentification
      chunks: [1000000]
      longName: "Report Identifier"

    - name: "MetaData/providerIdentifier1"
      source: variables/providerIdentifier1
      chunks: [1000000]
      longName: "Mesonet Provider Id String (1)"

    - name: "MetaData/providerIdentifier2"
      source: variables/providerIdentifier2
      chunks: [1000000]
      longName: "Mesonet Provider Id String (2)"

    - name: "MetaData/platformType"
      source: variables/platformType
      chunks: [1000000]
      longName: "Platform Type"

    - name: "MetaData/stationElevation"
      source: variables/stationElevation
      chunks: [1000000]
      longName: "Height Of Station"
      units: "m"

    - name: "MetaData/depthBelowLandSurface1"
      source: variables/depthBelowLandSurface1
      chunks: [1000000]
      longName: "Depth Below Land Surface (1)"
      units: "m"

    - name: "MetaData/depthBelowLandSurface2"
      source: variables/depthBelowLandSurface2
      chunks: [1000000]
      longName: "Depth Below Land Surface (2)"
      units: "m"

    - name: "MetaData/timePeriodHoursMntopcsq1"
      source: variables/timePeriodHoursMntopcsq1
      chunks: [1000000]
      longName: "Time Period Or Displacement (1)"
      units: "h"

    - name: "MetaData/timePeriodHoursMntopcsq2"
      source: variables/timePeriodHoursMntopcsq2
      chunks: [1000000]
      longName: "Time Period Or Displacement (2)"
      units: "h"

    - name: "MetaData/timePeriodHoursMntopcsq3"
      source: variables/timePeriodHoursMntopcsq3
      chunks: [1000000]
      longName: "Time Period Or Displacement (3)"
      units: "h"

    - name: "MetaData/timePeriodHoursMntopcsq4"
      source: variables/timePeriodHoursMntopcsq4
      chunks: [1000000]
      longName: "Time Period Or Displacement (4)"
      units: "h"

    - name: "MetaData/timePeriodHoursMndofssq1"
      source: variables/timePeriodHoursMndofssq1
      chunks: [1000000]
      longName: "Time Period Or Displacement (1)"
      units: "h"

    - name: "MetaData/timePeriodHoursMndofssq2"
      source: variables/timePeriodHoursMndofssq2
      chunks: [1000000]
      longName: "Time Period Or Displacement (2)"
      units: "h"

    # ObsValue
    - name: "ObsValue/airTemperatureTMDB"
      source: variables/airTemperatureTMDB
      chunks: [1000000]
      longName: "TEMPERATURE/DRY Bulb Temperature"
      units: "K"

    - name: "ObsValue/dewPointTemperature"
      source: variables/dewPointTemperature
      chunks: [1000000]
      longName: "Dew Point Temperature"
      units: "K"

    - name: "ObsValue/windDirection"
      source: variables/windDirection
      chunks: [1000000]
      longName: "Wind Direction"
      units: "degree"

    - name: "ObsValue/windSpeed"
      source: variables/windSpeed
      chunks: [1000000]
      longName: "Wind Speed"
      units: "m s-1"

    - name: "ObsValue/soilMoistureAvailability1"
      source: variables/soilMoistureAvailability1
      chunks: [1000000]
      longName: "Soil Moisture Availability (1)"
      units: "%"

    - name: "ObsValue/soilMoistureAvailability2"
      source: variables/soilMoistureAvailability2
      chunks: [1000000]
      longName: "Soil Moisture Availability (2)"
      units: "%"

    - name: "ObsValue/soilTemperature1"
      source: variables/soilTemperature1
      chunks: [1000000]
      longName: "Soil Temperature (1)"
      units: "K"

    - name: "ObsValue/soilTemperature2"
      source: variables/soilTemperature2
      chunks: [1000000]
      longName: "Soil Temperature (2)"
      units: "K"

    - name: "ObsValue/totalPrecipitation1"
      source: variables/totalPrecipitation1
      chunks: [1000000]
      longName: "Total PRECIPITATION/TOTAL Water Equivalent (1)"
      units: "kg m-2"

    - name: "ObsValue/totalPrecipitation2"
      source: variables/totalPrecipitation2
      chunks: [1000000]
      longName: "Total PRECIPITATION/TOTAL Water Equivalent (2)"
