encoder:
  globals:
    - name: "description"
      type: string
      value: "Mtyp 003-010 Gps Radio Occultn -CHAMP,COSMIC,GRACE,GRAS"

    - name: "dataCategory"
      type: string
      value: "vertical soundings from satellite"

    - name: "dataset"
      type: string
      value: "gnssro_bending_angle"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "003"

    - name: "bufrLocalSubcategory"
      type: string
      value: "010"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b003/xx010 NC003010"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteSubIdentifier"
      source: variables/satelliteSubIdentifier
      chunks: [1000000]
      longName: "Satellite SUB-IDENTIFIER"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      chunks: [1000000]
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      chunks: [1000000]
      longName: "Satellite Instruments"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/productTypeForRetrievedAtmosphericGases"
      source: variables/productTypeForRetrievedAtmosphericGases
      chunks: [1000000]
      longName: "Product Type For Retrieved Atmospheric Gases"

    - name: "MetaData/softwareIdentification"
      source: variables/softwareIdentification
      chunks: [1000000]
      longName: "Software Identification"

    - name: "MetaData/timeSignificance"
      source: variables/timeSignificance
      chunks: [1000000]
      longName: "Time Significance"

    - name: "MetaData/qfro"
      source: variables/qfro
      chunks: [1000000]
      longName: "Quality Flags For Radio Occultation Data"

    - name: "MetaData/qiWithoutForecast1"
      source: variables/qiWithoutForecast1
      chunks: [1000000]
      longName: "Per Cent Confidence"
      units: "%"

    - name: "MetaData/inDirectionOf0DegLongDistanceFromEarths"
      source: variables/inDirectionOf0DegLongDistanceFromEarths
      chunks: [1000000]
      longName: "In Direction Of 0 Deg LONG, Distance From EARTH'S Cent"
