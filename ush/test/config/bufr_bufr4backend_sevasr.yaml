time window:
  begin: "2024-02-18T21:00:00Z"
  end: "2024-02-19T03:00:00Z"
  bound to include: begin

observations:
- obs space:
    name: "sevasr-m8"
    simulated variables: [cloudAmount]
    obsdatain:
      engine:
        type: bufr
        obsfile: "./testinput/2024021900/gdas.t00z.sevasr.tm00.bufr_d"
        mapping file: "./bufr_sevasr.yaml"
        category: ["m8"]
        cache categories:            # optional
          - ["m8"]
          - ["m9"]
          - ["m10"]
          - ["m11"]
    obsdataout:
      engine:
        type: H5File
        obsfile: "./testoutput/2024021900/bufr4backend/gdas.t00z.sevasr_m8.tm00.nc"


