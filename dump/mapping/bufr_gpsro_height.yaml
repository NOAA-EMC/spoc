  variables:

#    # MetaData
#    # Longitude
#    - name: "MetaData/longitude"
#      source: variables/longitude
#      units: "degrees_east" 
#      range: [-180, 180]
#      longName: "Longitude" 
#
#    # Latitude
#    - name: "MetaData/latitude"
