bufr:
  subsets:
    - NC003010

  # One row per element of this sequence
  group_by_variable: geopotentialHeightRoseq4

  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    receiptTime:
      datetime:
        year: "*/RCYR"
        month: "*/RCMO"
        day: "*/RCDY"
        hour: "*/RCHR"
        minute: "*/RCMI"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteSubIdentifier:
      query: "*/SASBID"

    satelliteIdentifier:
      query: "*/SAID"

    instrumentIdentifier:
      query: "*/SIID"

    dataProviderOrigin:
      query: "*/OGCE"

    productTypeForRetrievedAtmosphericGases:
      query: "*/PTAG"

    softwareIdentification:
      query: "*/SWID"

    timeSignificance:
      query: "*/TSIG"

    qfro:
      query: "*/QFRO"

    qiWithoutForecast1:
      query: "*/PCCF[1]"

    inDirectionOf0DegLongDistanceFromEarths:
      query: "*/PD00"

    inDirectionOf90DegEDistanceFromEarthsCenter:
      query: "*/PD90"

    absolutePlatformVelocityFirstComponent:
      query: "*/PS00"

    absolutePlatformVelocitySecondComponent:
      query: "*/PS90"

    absolutePlatformVelocityThirdComponent:
      query: "*/PSNP"

    satelliteConstellationRO:
      query: "*/SCLF"

    satelliteTransmitterId:
      query: "*/PTID"

    inDirectionOf0DegLongDistanceFromEarths2:
      query: "*/PD00"

    inDirectionOf90DegEDistanceFromEarthsCenter2:
      query: "*/PD90"

    absolutePlatformVelocityFirstComponent2:
      query: "*/PS00"

    absolutePlatformVelocitySecondComponent2:
      query: "*/PS90"

    absolutePlatformVelocityThirdComponent2:
      query: "*/PSNP"

    timeIncrement:
      query: "*/TISE"

    inDirectionOf0DegLongDistanceFromEarths3:
      query: "*/PD00"

    inDirectionOf90DegEDistanceFromEarthsCenter3:
      query: "*/PD90"

    earthRadiusCurvature:
      query: "*/ELRC"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    geoidUndulation:
      query: "*/GEODU"

    geopotentialHeightRoseq4:
      query: "*/ROSEQ4/GPHTST"

    firstOrderStatistics1Roseq4:
      query: "*/ROSEQ4/FOST[1]"

    firstOrderStatistics2Roseq4:
      query: "*/ROSEQ4/FOST[2]"

    qiWithoutForecast:
      query: "*/ROSEQ4/PCCF"

    verticalSignificanceSatellite:
      query: "*/VSAT"

    geopotentialHeight:
      query: "*/GPHTST"

    firstOrderStatistics1:
      query: "*/FOST[1]"

    firstOrderStatistics2:
      query: "*/FOST[2]"

    qiWithoutForecast2:
      query: "*/PCCF[2]"

    restrictionFlag:
      query: "*/RSRD"

    restrictionExpiration:
      query: "*/EXPRSRD"

    sequenceNumber:
      query: "*/SEQNUM"

    bulletinHeader:
      query: "*/BUHD"

    bulletinOriginator:
      query: "*/BORG"

    bulletinTime:
      query: "*/BULTIM"

    bulletinBBB:
      query: "*/BBB"

    receiptTimeSignificance:
      query: "*/RCTS"

    # ObsValue
    inDirOfNorthPoleDistanceFromTheEarthsCenter:
      query: "*/PDNP"

    inDirOfNorthPoleDistanceFromTheEarthsCenter2:
      query: "*/PDNP"

    inDirOfNorthPoleDistanceFromTheEarthsCenter3:
      query: "*/PDNP"

    airPressure1Roseq4:
      query: "*/ROSEQ4/PRES[1]"

    airTemperature1:
      query: "*/ROSEQ4/TMDBST[1]"

    specificHumidity1:
      query: "*/ROSEQ4/SPFH[1]"

    airPressure2Roseq4:
      query: "*/ROSEQ4/PRES[2]"

    airTemperature2:
      query: "*/ROSEQ4/TMDBST[2]"

    specificHumidity2:
      query: "*/ROSEQ4/SPFH[2]"

    airPressure1:
      query: "*/PRES[1]"

    airPressure2:
      query: "*/PRES[2]"

    # QualityMarker
    correctedReportIndicator:
      query: "*/CORN"

encoder:
  globals:
    - name: "description"
      type: string
      value: "Mtyp 003-010 Gps Radio Occultn -CHAMP,COSMIC,GRACE,GRAS"

    - name: "dataCategory"
      type: string
      value: "vertical soundings from satellite"

    - name: "dataset"
      type: string
      value: "gnssro_retrieval"

    - name: "dataFormat"
      type: string
      value: "BUFR"

    - name: "restricted"
      type: string
      value: "false"

    - name: "bufrCategory"
      type: string
      value: "003"

    - name: "bufrLocalSubcategory"
      type: string
      value: "010"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centers for Environmental Prediction (NCEP)"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Tank - b003/xx010 NC003010"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:
    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      chunks: [1000000]
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/receiptTime"
      source: variables/receiptTime
      chunks: [1000000]
      longName: "Receipt Time"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      chunks: [1000000]
      longName: "Latitude"
      units: "degree_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      chunks: [1000000]
      longName: "Longitude"
      units: "degree_east"

    - name: "MetaData/satelliteSubIdentifier"
      source: variables/satelliteSubIdentifier
      chunks: [1000000]
      longName: "Satellite SUB-IDENTIFIER"

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteIdentifier
      chunks: [1000000]
      longName: "Satellite Identifier"

    - name: "MetaData/instrumentIdentifier"
      source: variables/instrumentIdentifier
      chunks: [1000000]
      longName: "Satellite Instruments"

    - name: "MetaData/dataProviderOrigin"
      source: variables/dataProviderOrigin
      chunks: [1000000]
      longName: "Identification Of ORIGINATING/GENERATING Center"

    - name: "MetaData/productTypeForRetrievedAtmosphericGases"
      source: variables/productTypeForRetrievedAtmosphericGases
      chunks: [1000000]
      longName: "Product Type For Retrieved Atmospheric Gases"

    - name: "MetaData/softwareIdentification"
      source: variables/softwareIdentification
      chunks: [1000000]
      longName: "Software Identification"

    - name: "MetaData/timeSignificance"
      source: variables/timeSignificance
      chunks: [1000000]
      longName: "Time Significance"

    - name: "MetaData/qfro"
      source: variables/qfro
      chunks: [1000000]
      longName: "Quality Flags For Radio Occultation Data"

    - name: "MetaData/qiWithoutForecast1"
      source: variables/qiWithoutForecast1
      chunks: [1000000]
      longName: "Per Cent Confidence"
      units: "%"

    - name: "MetaData/inDirectionOf0DegLongDistanceFromEarths"
      source: variables/inDirectionOf0DegLongDistanceFromEarths
      chunks: [1000000]
      longName: "In Direction Of 0 Deg LONG, Distance From EARTH'S Cent"
      units: "m"

    - name: "MetaData/inDirectionOf90DegEDistanceFromEarthsCenter"
      source: variables/inDirectionOf90DegEDistanceFromEarthsCenter
      chunks: [1000000]
      longName: "In Direction Of 90 Deg E, Distance From EARTH'S Center"
      units: "m"

    - name: "MetaData/absolutePlatformVelocityFirstComponent"
      source: variables/absolutePlatformVelocityFirstComponent
      chunks: [1000000]
      longName: "Absolute Platform Velocity - First Component"
      units: "m s-1"

    - name: "MetaData/absolutePlatformVelocitySecondComponent"
      source: variables/absolutePlatformVelocitySecondComponent
      chunks: [1000000]
      longName: "Absolute Platform Velocity - Second Component"
      units: "m s-1"

    - name: "MetaData/absolutePlatformVelocityThirdComponent"
      source: variables/absolutePlatformVelocityThirdComponent
      chunks: [1000000]
      longName: "Absolute Platform Velocity - Third Component"
      units: "m s-1"

    - name: "MetaData/satelliteConstellationRO"
      source: variables/satelliteConstellationRO
      chunks: [1000000]
      longName: "Satellite Classification"

    - name: "MetaData/satelliteTransmitterId"
      source: variables/satelliteTransmitterId
      chunks: [1000000]
      longName: "Platform Transmitter Id Number"

    - name: "MetaData/inDirectionOf0DegLongDistanceFromEarths2"
      source: variables/inDirectionOf0DegLongDistanceFromEarths2
      chunks: [1000000]
      longName: "In Direction Of 0 Deg LONG, Distance From EARTH'S Cent"
      units: "m"

    - name: "MetaData/inDirectionOf90DegEDistanceFromEarthsCenter2"
      source: variables/inDirectionOf90DegEDistanceFromEarthsCenter2
